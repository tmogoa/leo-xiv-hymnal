title: My Beautiful Share
lang: en
author: Unknown

body:
  - type: verse
    number: 1
    lines:
      - My beautiful share
      - On this day
      - I have made a good choice
      - For I have chosen the Lord

  - type: chorus
    lines:
      - "O! Merciful God"
      - I give You my heart
      - And all that I can say is
      - "Jesus! Jesus! Jesus!"

  - type: verse
    number: 2
    lines:
      - It is such a wonderful privilege
      - To have Jesus with me
      - To be with Him in His joy
      - And to be with Him in His grace

  - type: verse
    number: 3
    lines:
      - How can I thank Him?
      - What can I say today?
      - It is so amazing
      - What Jesus has done

  - type: verse
    number: 4
    lines:
      - My Lord said to me
      - Come and abide in me
      - And I answered saying
      - Jesus I abide in You

  - type: verse
    number: 5
    lines:
      - It is truly so
      - It is not I who lives
      - No! It is the Saviour
      - He is the one who gives me life

  - type: verse
    number: 6
    lines:
      - Please abide oh my Lord
      - Abide in me
      - Be the one alive in me
      - In the depths of my heart