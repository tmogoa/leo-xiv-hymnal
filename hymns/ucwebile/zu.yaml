title: Ucwebile
lang: zu

body:
  - type: verse
    number: 1
    lines:
      - Ucwebile, ucwebile, ucwebile Nkulunkulu
      - Osithandayo
      - "Wen' okhwez' izinto zonke"
      - "Maw' sibheke ngobubele"

  - type: verse
    number: 2
    lines:
      - Usikhweze ngomsa wakho
      - "Thin' esingabantu bakho"
      - Mhla simuka kulomhlaba
      - Uzusamukele Baba

  - type: verse
    number: 3
    lines:
      - Sithokoze njalonjalo
      - Embusweni waphezulu
      - Sikutuse sikubonge
      - Kanye nengelosi zonke