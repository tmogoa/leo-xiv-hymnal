title: At the Altar
lang: en

body:
  - type: verse
    number: 1
    lines:
      - At the altar it will be fulfilled
      - The sacrifice of Calvary
      - Come let us find grace
      - Through the blood of the Redeemer

  - type: chorus
    lines:
      - Lord we confess to you
      - All our sins
      - Grant us true repentance
      - They will be fully wiped away